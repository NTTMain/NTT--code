name: Salesforce CI/CD with Docker CLI

on:
  push:
    branches:
      - Dev
      - QA
  pull_request:
    branches:
      - Dev
      - QA
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Apex tests?"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    container:
      image: salesforce/cli:latest-full

    env:
      TEST_FLAG: ${{ github.event.inputs.run_tests || 'true' }}

    steps:
      # STEP 1 → Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2 → Install Node.js packages (container-safe)
      - name: Install sfdx-git-delta
        run: |
          npm install -g sfdx-git-delta
          sfdx-git-delta --version

      # STEP 3 → Print branch info
      - name: Print Branch Info
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_BASE_REF=${GITHUB_BASE_REF}"

      # STEP 4 → Generate Delta
      - name: Generate Delta
        run: |
          mkdir -p delta
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Generating delta for PR..."
            sfdx-git-delta \
              --from origin/${{ github.base_ref }} \
              --to HEAD \
              --output delta
          else
            echo "Generating delta for push..."
            sfdx-git-delta \
              --from HEAD~1 \
              --to HEAD \
              --output delta
          fi

      # STEP 5 → Authenticate to Dev Org
      - name: Authenticate to Dev Org
        if: github.ref == 'refs/heads/Dev' || github.base_ref == 'Dev'
        run: |
          echo "${{ secrets.DEV_SFDX_URL }}" > devAuth.txt
          sf org login sfdx-url -f devAuth.txt -a DevOrg -s

      # STEP 6 → Authenticate to QA Org
      - name: Authenticate to QA Org
        if: github.ref == 'refs/heads/QA' || github.base_ref == 'QA'
        run: |
          echo "${{ secrets.QA_SFDX_URL }}" > qaAuth.txt
          sf org login sfdx-url -f qaAuth.txt -a QaOrg -s

      # STEP 7 → Validation for Pull Requests
      - name: Validate Deployment (checkonly)
        if: github.event_name == 'pull_request'
        run: |
          echo "Running validation..."
          if [ "${TEST_FLAG}" = "true" ]; then
            sf project deploy validate \
              --source-dir delta \
              -l RunLocalTests \
              -w 60
          else
            sf project deploy validate \
              --source-dir delta \
              -l NoTestRun \
              -w 60
          fi

      # STEP 8 → Deploy on Push
      - name: Deploy to Salesforce
        if: github.event_name == 'push'
        run: |
          echo "Starting deployment..."
          if [ "${TEST_FLAG}" = "true" ]; then
            sf project deploy start \
              --source-dir delta \
              -l RunLocalTests \
              -w 60
          else
            sf project deploy start \
              --source-dir delta \
              -l NoTestRun \
              -w 60
          fi
