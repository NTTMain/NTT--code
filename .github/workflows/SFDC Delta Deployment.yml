name: Salesforce CI/CD with Delta Deployment

on:
  push:
    branches:
      - Dev
      - QA
  pull_request:
    branches:
      - Dev
      - QA
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Apex tests?"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    container:
      image: salesforce/cli:latest-full

    env:
      RUN_TESTS: ${{ github.event.inputs.run_tests || 'true' }}

    steps:
      # 1️⃣ Checkout full git history (required for delta)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install sfdx-git-delta
      - name: Install sfdx-git-delta
        run: npm install -g sfdx-git-delta

      # 3️⃣ Show branch info
      - name: Print branch info
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Base ref: $GITHUB_BASE_REF"

      - name: Generate Delta
        run: |
            mkdir -p delta

            if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="origin/${GITHUB_BASE_REF}"
            TO="HEAD"
              else
            FROM="HEAD~1"
            TO="HEAD"
            fi

                echo "Delta from $FROM to $TO"

            sfdx-git-delta \
      --from "$FROM" \
      --to "$TO" \
      --output delta \
      --source force-app

    echo "Delta contents:"
    ls -R delta


      # 5️⃣ Authenticate to Dev Org
      - name: Authenticate Dev Org
        if: github.ref == 'refs/heads/Dev' || github.base_ref == 'Dev'
        run: |
          echo "${{ secrets.DEV_SFDX_URL }}" > devAuth.txt
          sf org login sfdx-url -f devAuth.txt -a DevOrg -s

      # 6️⃣ Authenticate to QA Org
      - name: Authenticate QA Org
        if: github.ref == 'refs/heads/QA' || github.base_ref == 'QA'
        run: |
          echo "${{ secrets.QA_SFDX_URL }}" > qaAuth.txt
          sf org login sfdx-url -f qaAuth.txt -a QaOrg -s

      # 7️⃣ Validate on Pull Request
      - name: Validate Deployment (PR)
        if: github.event_name == 'pull_request'
        run: |
          if [ "${RUN_TESTS}" = "true" ]; then
            sf project deploy validate \
              --source-dir delta/force-app \
              -l RunLocalTests \
              -w 60
          else
            sf project deploy validate \
              --source-dir delta/force-app \
              -l NoTestRun \
              -w 60
          fi

      # 8️⃣ Deploy on Push
      - name: Deploy to Salesforce
        if: github.event_name == 'push'
        run: |
          if [ "${RUN_TESTS}" = "true" ]; then
            sf project deploy start \
              --source-dir delta/force-app \
              -l RunLocalTests \
              -w 60
          else
            sf project deploy start \
              --source-dir delta/force-app \
              -l NoTestRun \
              -w 60
          fi
