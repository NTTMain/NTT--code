name: Salesforce CI/CD with Docker CLI

on:
  push:
    branches: [Dev, QA]
  pull_request:
    branches: [Dev, QA]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Apex tests?"
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: salesforce/cli:latest-full

    env:
      TEST_FLAG: ${{ github.event.inputs.run_tests != '' && github.event.inputs.run_tests || 'true' }}

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Node.js
      - name: Install Node.js
        run: |
          apt-get update
          apt-get install -y nodejs npm
          node -v
          npm -v

      # Install sfdx-git-delta
      - name: Install sfdx-git-delta
        run: | 
          npm install -g sfdx-git-delta
          echo "$(npm bin -g)" >> $GITHUB_PATH

      # Show branch
      - name: Print branch
        run: |
          echo "Ref: $GITHUB_REF"
          echo "Base ref: $GITHUB_BASE_REF"

      # Authenticate Dev Org
      - name: Authenticate Dev Org
        if: github.ref == 'refs/heads/Dev' || github.base_ref == 'Dev'
        run: |
          echo "${{ secrets.DEV_SFDX_URL }}" > devAuth.txt
          sf org login sfdx-url -f devAuth.txt -a DevOrg -s

      # Authenticate QA Org
      - name: Authenticate QA Org
        if: github.ref == 'refs/heads/QA' || github.base_ref == 'QA'
        run: |
          echo "${{ secrets.QA_SFDX_URL }}" > qaAuth.txt
          sf org login sfdx-url -f qaAuth.txt -a QaOrg -s

      # Generate delta
      - name: Generate Delta
        run: |
          mkdir -p delta

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Generating delta for PR..."
            sfdx-git-delta \
              --from ${{ github.event.pull_request.base.sha }} \
              --to   ${{ github.event.pull_request.head.sha }} \
              --output delta
          else
            echo "Generating delta for push..."
            sfdx-git-delta \
              --from HEAD~1 \
              --to   HEAD \
              --output delta
          fi

      # Validate (PR only)
      - name: Validate Deployment
        if: github.event_name == 'pull_request'
        run: |
          echo "Validation deploy (check only)"

          if [ "$TEST_FLAG" = "true" ]; then
            sf project deploy start \
              --source-dir delta \
              --test-level RunLocalTests \
              --dry-run \
              -w 60
          else
            sf project deploy start \
              --source-dir delta \
              --test-level NoTestRun \
              --dry-run \
              -w 60
          fi

      # Deploy (push only)
      - name: Deploy to Salesforce
        if: github.event_name == 'push'
        run: |
          echo "Deploying to org"

          if [ "$TEST_FLAG" = "true" ]; then
            sf project deploy start \
              --source-dir delta \
              --test-level RunLocalTests \
              -w 60
          else
            sf project deploy start \
              --source-dir delta \
              --test-level NoTestRun \
              -w 60
          fi
